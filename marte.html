<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR ITC Games · Misión Marte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/mision_marte.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/marte.js"></script>
  <style>
    .ayuda-2d {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font: 14px/1.4 Rajdhani, "Segoe UI", system-ui, sans-serif; color: #e6e8eb;
      background: rgba(5, 5, 6, .88); border: 1px solid rgba(255, 22, 56, .5); padding: 8px 12px; border-radius: 8px;
    }
    .ayuda-2d a { color: #ff1638; }
  </style>
</head>
<body>
  <a-scene background="color: #2a120c" renderer="antialias: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <!-- Marte: terreno, montañas, la Tierra en el cielo y un domo geodésico de cristal -->
    <a-entity ambiente-marte></a-entity>

    <!-- luz cálida del sol marciano -->
    <a-entity light="type: ambient; color: #ffcfb0; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #ffd7b0; intensity: 1.5" position="6 9 4"></a-entity>
    <a-entity light="type: point; color: #ff1638; intensity: 0.8; distance: 5" position="-1.6 1.8 -1.2"></a-entity>

    <!-- jugador sentado: cámara y los dos controles con apuntador láser -->
    <a-entity id="jugador">
      <a-entity camera position="0 1.2 0" look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: false"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 6; lineColor: #ff1638"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 6; lineColor: #ff1638"></a-entity>
    </a-entity>

    <!-- el juego: panel de sensores, escáner con la muestra y el rover afuera -->
    <a-entity id="juego" mision-marte></a-entity>
  </a-scene>

  <div class="ayuda-2d">Modo 2D: haz clic en los botones, o usa el teclado (R = roca, H = hielo, M = metal, V = vida). Arrastra para mirar el domo y el rover. En el visor, toca "VR" abajo a la derecha. · <a href="index.html">Menú</a></div>
</body>
</html>
