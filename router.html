<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR ITC Games · Router humano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="js/router_datos.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/router.js"></script>
  <style>
    .ayuda-2d {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      font: 14px/1.4 Rajdhani, "Segoe UI", system-ui, sans-serif; color: #e6e8eb;
      background: rgba(5, 5, 6, .88); border: 1px solid rgba(255, 22, 56, .5); padding: 8px 12px; border-radius: 8px;
    }
    .ayuda-2d a { color: #ff1638; }
  </style>
</head>
<body>
  <a-scene background="color: #050506" renderer="antialias: true" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <!-- dentro de la computadora: circuitos, chips y pulsos de datos -->
    <a-entity ambiente-circuito></a-entity>

    <!-- luz -->
    <a-entity light="type: ambient; color: #8fa6ff; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.4" position="1 3 1.5"></a-entity>
    <a-entity light="type: point; color: #ff3fb4; intensity: 0.8; distance: 4" position="-1 1.5 -1"></a-entity>

    <!-- jugador sentado: cámara y los dos controles con apuntador láser -->
    <a-entity id="jugador">
      <a-entity camera position="0 1.2 0" look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: false"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 6; lineColor: #ff1638"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 6; lineColor: #ff1638"></a-entity>
    </a-entity>

    <!-- el juego: consola, paquete y portales alrededor -->
    <a-entity id="juego" router-humano></a-entity>
  </a-scene>

  <div class="ayuda-2d">Modo 2D: arrastra para mirar alrededor y haz clic en el portal, o usa el teclado (S = salón, B = biblioteca, I = internet, V = servidores, T = satélite, D = descartar). En el visor, toca "VR". · <a href="index.html">Menú</a></div>
</body>
</html>
